apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tech-challenge

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  # secret.example.yaml is NOT listed on purpose — copy to secret.yaml locally,
  # apply with `kubectl apply -f secret.yaml`, never commit real values.

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: tech-challenge
