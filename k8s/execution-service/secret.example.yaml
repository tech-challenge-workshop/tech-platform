# Template — do NOT commit real secrets.
#
# Do not fill this in by hand: run ../secrets-from-tofu.sh, which reads the
# OpenTofu outputs and Secrets Manager and writes secret.yaml (gitignored).
#
# DocumentDB enforces TLS and presents an Amazon RDS CA that is not in the
# public trust store, so the URI points tlsCAFile at the bundle the
# deployment's init container downloads into /etc/ssl/docdb.
apiVersion: v1
kind: Secret
metadata:
  name: execution-service
  namespace: tech-challenge
type: Opaque
stringData:
  MONGODB_URL: mongodb://execution:CHANGE_ME@CHANGE_ME.docdb.amazonaws.com:27017/execution?tls=true&tlsCAFile=/etc/ssl/docdb/global-bundle.pem&replicaSet=rs0&retryWrites=false&authSource=admin
  RABBITMQ_URL: amqps://tech_challenge:CHANGE_ME@CHANGE_ME.mq.us-east-1.amazonaws.com:5671
  JWT_SECRET: CHANGE_ME
