# Template — do NOT commit real secrets.
#
# Do not fill this in by hand: run ../secrets-from-tofu.sh, which reads the
# OpenTofu outputs and Secrets Manager and writes secret.yaml (gitignored).
#
# The document store is MongoDB Atlas, not DocumentDB: the AWS Free Plan
# refuses to provision DocumentDB. Atlas serves TLS with a publicly trusted
# certificate, so unlike DocumentDB there is no CA bundle to mount.
apiVersion: v1
kind: Secret
metadata:
  name: execution-service
  namespace: tech-challenge
type: Opaque
stringData:
  MONGODB_URL: mongodb+srv://execution:CHANGE_ME@CHANGE_ME.mongodb.net/execution?retryWrites=true&w=majority
  RABBITMQ_URL: amqps://tech_challenge:CHANGE_ME@CHANGE_ME.mq.us-east-1.amazonaws.com:5671
  JWT_SECRET: CHANGE_ME
