apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: tech-challenge
  labels:
    app: execution-service
    app.kubernetes.io/name: execution-service
    app.kubernetes.io/part-of: tech-challenge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
        app.kubernetes.io/name: execution-service
        app.kubernetes.io/part-of: tech-challenge
        tags.datadoghq.com/service: execution-service
        tags.datadoghq.com/env: production
    spec:
      # DocumentDB requires TLS and presents an Amazon RDS CA that is not in the
      # public trust store. Fetching the bundle here keeps it out of the service
      # image, so the same image still runs against plain MongoDB locally.
      initContainers:
        - name: fetch-docdb-ca
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - >-
              curl -fsSL --retry 3
              https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
              -o /etc/ssl/docdb/global-bundle.pem
          volumeMounts:
            - name: docdb-ca
              mountPath: /etc/ssl/docdb
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: app
          image: ghcr.io/tech-challenge-workshop/execution-service:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          envFrom:
            - configMapRef:
                name: execution-service
            - secretRef:
                name: execution-service
          volumeMounts:
            - name: docdb-ca
              mountPath: /etc/ssl/docdb
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: docdb-ca
          emptyDir: {}
      restartPolicy: Always
