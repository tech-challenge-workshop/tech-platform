apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: tech-challenge
  labels:
    app: execution-service
    app.kubernetes.io/name: execution-service
    app.kubernetes.io/part-of: tech-challenge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
        app.kubernetes.io/name: execution-service
        app.kubernetes.io/part-of: tech-challenge
        tags.datadoghq.com/service: execution-service
        tags.datadoghq.com/env: production
    spec:
      # The GHCR packages are private; this secret is generated by
      # ../secrets-from-tofu.sh from a token with read:packages.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: app
          image: ghcr.io/tech-challenge-workshop/execution-service:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          envFrom:
            - configMapRef:
                name: execution-service
            - secretRef:
                name: execution-service
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
