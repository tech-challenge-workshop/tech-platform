# Template — do NOT commit the real secret.
#
# The GHCR packages are private, so every pod needs a credential to pull its
# image. Generated by ../secrets-from-tofu.sh, which builds the dockerconfigjson
# from GHCR_PAT — a classic token carrying only the read:packages scope.
#
#   export GHCR_PAT=ghp_...          # https://github.com/settings/tokens/new
#   ./secrets-from-tofu.sh
#
# One secret serves the whole namespace; each Deployment references it through
# imagePullSecrets. If the token expires the symptom is every pod stuck in
# ImagePullBackOff — regenerate the token, rerun the script, reapply.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: tech-challenge
type: kubernetes.io/dockerconfigjson
data:
  # base64 of {"auths":{"ghcr.io":{"username":"...","password":"...","auth":"..."}}}
  .dockerconfigjson: CHANGE_ME
