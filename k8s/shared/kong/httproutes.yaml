---
# ─── billing-service (all routes JWT-protected) ─────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: billing-private
  namespace: tech-challenge
  annotations:
    konghq.com/plugins: jwt-hs256,rate-limit-60rpm
spec:
  parentRefs:
    - name: kong
      namespace: kong
  rules:
    - matches:
        - path: { type: PathPrefix, value: /quotes }
        - path: { type: PathPrefix, value: /payments }
      backendRefs:
        - name: billing-service
          port: 3001
