# Helm values for the kong/ingress chart (bundles Kong Gateway + KIC).
# Install with:
#   helm repo add kong https://charts.konghq.com && helm repo update
#   helm install kong kong/ingress -n kong --create-namespace -f values.yaml
#
# On EKS the LoadBalancer service provisions an NLB automatically.

gateway:
  env:
    database: "off"                # DB-less, config comes from CRDs (KIC)
  proxy:
    enabled: true
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    http:
      enabled: true
      servicePort: 80
    tls:
      enabled: true
      servicePort: 443
  # The controller pushes configuration through the admin API, so it has to be
  # enabled — disabling it deadlocks the install: the gateway never turns Ready
  # without config, and the controller never finds an endpoint to send it to.
  # Keeping it a headless ClusterIP is what stops it reaching the internet;
  # only the proxy above gets a LoadBalancer.
  # The controller reaches the admin API over TLS on 8444, so the plain HTTP
  # listener stays off — enabling only http makes it fail with connection
  # refused on 8444.
  admin:
    enabled: true
    type: ClusterIP
    clusterIP: None
    http:
      enabled: false
    tls:
      enabled: true

ingressController:
  enabled: true
  ingressClass: kong
  installCRDs: false
  gatewayDiscovery:
    enabled: true
    generateAdminApiService: true
