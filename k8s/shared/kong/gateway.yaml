# Gateway API Gateway resource — HTTPRoutes reference this by parentRefs.
# The helm chart creates a GatewayClass "kong"; this Gateway binds to it and
# listens on port 80 (HTTPS handled by the NLB / a separate listener block
# when a cert is available).

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kong
  namespace: kong
spec:
  gatewayClassName: kong
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
