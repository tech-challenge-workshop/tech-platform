apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kong Gateway + KIC are installed via Helm chart (see values.yaml + README).
# Routing is expressed as Ingress — see the note at the top of ingresses.yaml
# for why Gateway API was abandoned.

resources:
  - ingresses.yaml
  - kong-plugins.yaml
  # kong-consumer.example.yaml is NOT listed on purpose — copy to
  # kong-consumer.yaml (gitignored), fill JWT_SECRET, apply manually.
