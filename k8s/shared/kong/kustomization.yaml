apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kong Gateway + KIC are installed via Helm chart (see values.yaml + README).
# The declarative resources below live in the tech-challenge namespace and
# reference the Gateway created in the kong namespace.

resources:
  - gateway.yaml
  - kong-plugins.yaml
  - httproutes.yaml
  # kong-consumer.example.yaml is NOT listed on purpose — copy to
  # kong-consumer.yaml (gitignored), fill JWT_SECRET, apply manually.
