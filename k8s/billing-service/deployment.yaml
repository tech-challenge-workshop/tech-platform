apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: tech-challenge
  labels:
    app: billing-service
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: tech-challenge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/part-of: tech-challenge
        tags.datadoghq.com/service: billing-service
        tags.datadoghq.com/env: production
    spec:
      containers:
        - name: app
          image: ghcr.io/tech-challenge-workshop/billing-service:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: billing-service
            - secretRef:
                name: billing-service
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
