apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: tech-challenge
  labels:
    app: billing-service
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: tech-challenge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/part-of: tech-challenge
        tags.datadoghq.com/service: billing-service
        tags.datadoghq.com/env: production
    spec:
      # RDS presents the Amazon RDS CA, which is not in the public trust store,
      # so a TLS handshake fails with "self-signed certificate in certificate
      # chain" unless the bundle is available. Fetching it here keeps it out of
      # the service image, so the same image still runs against a plain
      # PostgreSQL container locally.
      initContainers:
        - name: fetch-rds-ca
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - >-
              curl -fsSL --retry 3
              https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
              -o /etc/ssl/rds/global-bundle.pem
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/ssl/rds
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      # The GHCR packages are private; this secret is generated by
      # ../secrets-from-tofu.sh from a token with read:packages.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: app
          image: ghcr.io/tech-challenge-workshop/billing-service:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            # The agent runs as a DaemonSet with a host port, so each pod talks
            # to the agent on its own node. An explicit env beats envFrom.
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/ssl/rds
              readOnly: true
          envFrom:
            - configMapRef:
                name: billing-service
            - secretRef:
                name: billing-service
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: rds-ca
          emptyDir: {}
      restartPolicy: Always
