name: k8s-validate

on:
  push:
    branches: [main]
    paths: ['k8s/**']
  pull_request:
    paths: ['k8s/**']

jobs:
  kustomize-render-and-schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl (bundles kustomize)
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz && sudo mv kubeconform /usr/local/bin/

      - name: Render + count resources
        run: |
          set -euo pipefail
          COUNT=$(kubectl kustomize k8s | grep -c '^kind:')
          echo "Rendered $COUNT resources"
          test "$COUNT" -ge 20

      - name: Validate against upstream schemas
        run: |
          kubectl kustomize k8s \
            | kubeconform -summary -strict \
                -ignore-missing-schemas \
                -schema-location default
